services:
  gateway:
    build: .
    image: linear-agent-gateway:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LINEAR_PORT:-8089}:8089"
    environment:
      LINEAR_HOST: "0.0.0.0"
      LINEAR_PORT: "8089"
      LINEAR_POLL_MS: "${LINEAR_POLL_MS:-1500}"
      LINEAR_TIMEOUT_MS: "${LINEAR_TIMEOUT_MS:-180000}"
      LINEAR_PUBLIC_URL: "${LINEAR_PUBLIC_URL:-}"
      LINEAR_CLIENT_TOOLS: "${LINEAR_CLIENT_TOOLS:-structured}"
      LINEAR_STREAM_MODE: "${LINEAR_STREAM_MODE:-incremental}"
      LINEAR_TOOL_CONTINUATION: "${LINEAR_TOOL_CONTINUATION:-native}"
      LINEAR_TOOL_REPAIR_ATTEMPTS: "${LINEAR_TOOL_REPAIR_ATTEMPTS:-1}"
      LINEAR_MAX_CONCURRENCY: "${LINEAR_MAX_CONCURRENCY:-4}"
      LINEAR_ACCOUNT_CONCURRENCY: "${LINEAR_ACCOUNT_CONCURRENCY:-1}"
      LINEAR_MAX_QUEUE: "${LINEAR_MAX_QUEUE:-8}"
      LINEAR_PROMPT_FORMAT: "${LINEAR_PROMPT_FORMAT:-rich}"
      LINEAR_STRICT_PARAMETERS: "${LINEAR_STRICT_PARAMETERS:-0}"
      LINEAR_MAX_BODY_BYTES: "${LINEAR_MAX_BODY_BYTES:-8388608}"
      LINEAR_MAX_PROMPT_CHARS: "${LINEAR_MAX_PROMPT_CHARS:-1000000}"
      LINEAR_TOOL_SESSION_TTL_SECONDS: "${LINEAR_TOOL_SESSION_TTL_SECONDS:-86400}"
      LINEAR_IDEMPOTENCY_SECONDS: "${LINEAR_IDEMPOTENCY_SECONDS:-300}"
      LINEAR_REALTIME: "${LINEAR_REALTIME:-ws}"
      LINEAR_REALTIME_SUBSCRIPTION: "${LINEAR_REALTIME_SUBSCRIPTION:-conversation}"
      LINEAR_REALTIME_URL: "${LINEAR_REALTIME_URL:-wss://sync.linear.app/}"
      LINEAR_REALTIME_CLIENT_VERSION: "${LINEAR_REALTIME_CLIENT_VERSION:-}"
      LINEAR_REALTIME_POLL_MS: "${LINEAR_REALTIME_POLL_MS:-3000}"
      LINEAR_REALTIME_CONNECT_TIMEOUT_MS: "${LINEAR_REALTIME_CONNECT_TIMEOUT_MS:-5000}"
      LINEAR_REALTIME_MAX_MESSAGE_BYTES: "${LINEAR_REALTIME_MAX_MESSAGE_BYTES:-4194304}"
      LINEAR_TIMING_LOG: "${LINEAR_TIMING_LOG:-1}"
    volumes:
      - linear-data:/app/.local-runtime
    stop_grace_period: 15s

volumes:
  linear-data:
