<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linear 凭证提取</title><link rel="stylesheet" href="popup.css"></head>
<body><main><div class="brand">LINEAR AGENT GATEWAY</div><h1>一键提取凭证</h1><p>在当前浏览器登录 Linear，进入目标工作区，再点击下方按钮。</p><div class="card"><strong id="target">正在读取当前标签页…</strong><p>提取会刷新当前页面。请先保存未提交的输入。</p><button id="capture" disabled>一键提取并下载 JSON</button><button id="download" hidden>下载已提取的 JSON</button><button id="cancel" class="secondary" hidden>取消并清除</button></div><p id="status" role="status" aria-live="polite"></p><div id="identity" hidden><div>用户 ID：<code id="user"></code></div><div>工作区 ID：<code id="organization"></code></div></div><p class="note">下载后，到网关的“账户管理 → 导入账户凭证”选择 JSON。添加其他账号时，切换 Linear 登录账号后重新提取。</p><p class="note">只在点击后读取当前标签页的请求；不发送聊天、不上传凭证。临时结果最多保留 5 分钟，导出后即清除。JSON 含登录 Cookie，请保存在自己可访问的位置。</p></main><script type="module" src="popup.mjs"></script></body></html>
